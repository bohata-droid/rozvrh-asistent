name: Aktualizovat rozvrh

on:
  schedule:
    # Běží v pondělí až pátek v 5:00 UTC (v ČR je to 6:00 nebo 7:00 ráno podle letního času)
    - cron: '0 5 * * 1-5'
  workflow_dispatch: # Umožní skript kdykoliv spustit i ručně kliknutím v GitHubu

permissions:
  contents: write # DŮLEŽITÉ: dává botovi právo ukládat změny do repozitáře

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kódu
        uses: actions/checkout@v4

      - name: Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Spuštění stahování
        run: python fetch_timetable.py

      - name: Uložení a commit timetable.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add timetable.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: aktualizace rozvrhu [skip ci]" && git push)
