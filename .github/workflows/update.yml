name: Aktualizovat rozvrh

on:
  schedule:
    # Pondeli az patek v 5:00 UTC (v Cesku 6:00 nebo 7:00 podle letniho casu).
    - cron: "0 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-timetable:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repozitare
        uses: actions/checkout@v7

      - name: Nastaveni Pythonu
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Stazeni rozvrhu
        shell: bash
        run: |
          # Verejne EduPage API obcas docasne odmita nebo prerusi pozadavek.
          # Zkusime ho proto opakovane; pri delsim vypadku ponechame posledni
          # platny export a dalsi naplanovany beh to zkusi znovu.
          for attempt in 1 2 3 4 5; do
            if python fetch_timetable.py; then
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 30))
              echo "Stazeni selhalo (pokus $attempt/5), dalsi pokus za ${delay} s."
              sleep "$delay"
            fi
          done

          echo "::warning::EduPage je docasne nedostupny. Ponechavam posledni platny rozvrh."

      - name: Ulozeni timetable.json
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timetable.json timetable-data.js

          if git diff --staged --quiet; then
            echo "Rozvrh se nezmenil."
            exit 0
          fi

          git commit -m "Auto: aktualizace rozvrhu [skip ci]"
          git push
