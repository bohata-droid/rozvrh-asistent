name: Aktualizovat rozvrh

on:
  schedule:
    # Pondeli az patek v 5:00 UTC (v Cesku 6:00 nebo 7:00 podle letniho casu).
    - cron: "0 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-timetable:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repozitare
        uses: actions/checkout@v4

      - name: Nastaveni Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Stazeni rozvrhu
        run: python fetch_timetable.py

      - name: Ulozeni timetable.json
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timetable.json timetable-data.js

          if git diff --staged --quiet; then
            echo "Rozvrh se nezmenil."
            exit 0
          fi

          git commit -m "Auto: aktualizace rozvrhu [skip ci]"
          git push
